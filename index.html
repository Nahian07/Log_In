<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/76efe7f9b9.js" crossorigin="anonymous"></script>
    <title>SIGN UP FORM</title>

</head>
<body>
    <div class="wrapper">
        <form action="" id="form">
            <h1>Sign Up</h1>
            <div class="input-box">
                <input type="text" id="username" placeholder="Username">
                <i class="fa-solid fa-user"></i>
                <small>Username must be atleast 3 characters</small>
            </div>
            <div class="input-box">
                <input type="email" id="mail" placeholder="Email">
                <i class="fa-solid fa-envelope"></i>
                <small>Email is not valid !</small>
            </div>
            <!-- <div class="input-box">
                <input type="email" placeholder="Email">
            </div> -->
            <div class="input-box">
                <input type="password" id="password1" placeholder="Password">
                <i class="fa-solid fa-lock"></i>
                <small>Password must be atleast 6 characters</small>
            </div>
            <div class="input-box">
                <input type="password" id="password2" placeholder="Re-type">
                <i class="fa-solid fa-lock"></i>
                <small>Did not match ! Re-try</small>
            </div>
            <div class="remember-forget">
                <label>
                    <input type="checkbox">Remember Me
                </label>
                <a href="#" style="color: #fff;">Forgot Password?</a>
            </div>

            <button type="submit" class="btn">Sign Up</button>
        </form>
    </div>

    


    <script src="main.js"></script>
</body>
</html>
